<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayBeat — Unified Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Exo+2:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Share+Tech+Mono&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
 <style>
    /* ═══════════════════════════════════════════════════════════
       FINTECH ANALYTICS PLATFORM — ULTRA DARK THEME
       Inspired by: Fintech Landing Page / Finance Analytical Platform
       Palette: Deep charcoal #060d1a · Navy #0a1628 · Surface #0e1e36
       Accent: Electric cyan #00d4ff · Teal glow #00ffcc · Amber alert #f5a623
       ═══════════════════════════════════════════════════════════ */

    /* ── CSS Variables ─────────────────────────────────────── */
    :root {
      --bg-base:        #060d1a;
      --bg-surface:     #0a1628;
      --bg-panel:       #0e1e36;
      --bg-glass:       rgba(14,30,54,.82);
      --border-dim:     rgba(0,212,255,.08);
      --border-mid:     rgba(0,212,255,.18);
      --border-bright:  rgba(0,212,255,.42);
      --accent-cyan:    #00d4ff;
      --accent-teal:    #00ffcc;
      --accent-amber:   #f5a623;
      --accent-purple:  #7c6fff;
      --text-primary:   #e4f0ff;
      --text-secondary: #6a8fb5;
      --text-dim:       #2e4a6e;
      --glow-cyan:      0 0 18px rgba(0,212,255,.35);
      --glow-teal:      0 0 18px rgba(0,255,204,.3);
      --glow-amber:     0 0 14px rgba(245,166,35,.3);
    }

    /* ── Page Hero ─────────────────────────────────────────── */
    .page-hero {
      background:
        radial-gradient(ellipse 80% 60% at 60% -20%, rgba(0,212,255,.06) 0%, transparent 65%),
        radial-gradient(ellipse 50% 40% at 100% 80%, rgba(0,255,204,.04) 0%, transparent 60%),
        linear-gradient(175deg, var(--bg-surface) 0%, var(--bg-base) 100%);
      border-bottom: 1px solid var(--border-dim);
      padding: 3rem 0 2.5rem;
      position: relative; overflow: hidden;
    }

    /* grid-dot pattern overlay */
    .page-hero::before {
      content:'';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(var(--border-dim) 1px, transparent 1px),
        linear-gradient(90deg, var(--border-dim) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse 80% 90% at 50% 50%, black 30%, transparent 80%);
      pointer-events: none;
    }

    /* cyan accent bar on left edge */
    .page-hero::after {
      content:'';
      position: absolute; top: 0; left: 0; bottom: 0; width: 3px;
      background: linear-gradient(180deg, transparent, var(--accent-cyan), var(--accent-teal), transparent);
      pointer-events: none;
    }

    .page-hero-inner {
      max-width: 1280px; margin: 0 auto; padding: 0 1.5rem;
      display: flex; align-items: center; justify-content: space-between; gap: 2rem;
      position: relative; z-index: 1;
    }
    .page-hero-left { flex: 1; }

    .page-hero-tag {
      display: inline-flex; align-items: center; gap: 7px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--accent-cyan);
      border: 1px solid var(--border-bright);
      background: rgba(0,212,255,.07);
      padding: 5px 14px 5px 10px; border-radius: 2px;
      margin-bottom: 18px;
      box-shadow: var(--glow-cyan), inset 0 0 12px rgba(0,212,255,.04);
    }
    .page-hero-tag::before {
      content: '';
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%,100% { opacity:1; transform:scale(1); }
      50% { opacity:.5; transform:scale(.75); }
    }

    .page-hero h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 800; line-height: 1.15;
      color: var(--text-primary); margin-bottom: 14px;
      letter-spacing: -.5px;
      text-shadow: 0 0 40px rgba(0,212,255,.15);
    }
    .page-hero h1 span { color: var(--accent-cyan); }

    .page-hero p {
      font-family: 'Exo 2', sans-serif;
      color: var(--text-secondary); font-size: 15px; line-height: 1.75; max-width: 480px;
    }

    .page-hero-right {
      display: flex; flex-direction: column; gap: 10px;
      align-items: flex-end; flex-shrink: 0;
    }

    .hero-stat {
      background: var(--bg-glass);
      border: 1px solid var(--border-mid);
      border-radius: 6px; padding: 12px 22px; text-align: center; min-width: 130px;
      backdrop-filter: blur(12px);
      position: relative; overflow: hidden;
      transition: border-color .2s, box-shadow .2s;
    }
    .hero-stat::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
    }
    .hero-stat:hover {
      border-color: var(--border-bright);
      box-shadow: var(--glow-cyan);
    }
    .hero-stat b {
      display: block; font-family: 'Orbitron', sans-serif;
      font-size: 20px; font-weight: 700; color: var(--accent-cyan);
      text-shadow: 0 0 12px rgba(0,212,255,.5);
    }
    .hero-stat span { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; }

    /* ── Filter Bar ────────────────────────────────────────── */
    .filter-bar {
      background: rgba(6,13,26,.96);
      border-bottom: 1px solid var(--border-dim);
      border-top: 1px solid var(--border-dim);
      position: sticky; top: 0; z-index: 20; padding: .75rem 0;
      backdrop-filter: blur(16px) saturate(1.4);
    }
    .filter-bar-inner {
      max-width: 1280px; margin: 0 auto; padding: 0 1.5rem;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .filter-label {
      font-family: 'Share Tech Mono', monospace; font-size: 9.5px; letter-spacing: 2px;
      text-transform: uppercase; color: var(--text-dim); white-space: nowrap;
    }
    .filter-select {
      background: rgba(10,22,40,.95); border: 1px solid var(--border-mid);
      color: var(--text-secondary); font-family: 'Exo 2', sans-serif; font-size: 12px;
      padding: 7px 12px; border-radius: 4px; cursor: pointer; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .filter-select:focus { border-color: var(--accent-cyan); box-shadow: 0 0 0 2px rgba(0,212,255,.12); }
    .filter-search {
      flex: 1; min-width: 180px; max-width: 320px;
      background: rgba(10,22,40,.95); border: 1px solid var(--border-mid);
      color: var(--text-primary); font-family: 'Exo 2', sans-serif; font-size: 12px;
      padding: 7px 14px; border-radius: 4px; outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .filter-search:focus { border-color: var(--accent-cyan); box-shadow: 0 0 0 2px rgba(0,212,255,.12); }
    .filter-search::placeholder { color: var(--text-dim); }
    .result-count {
      margin-left: auto; font-family: 'Share Tech Mono', monospace;
      font-size: 9.5px; color: var(--text-dim); letter-spacing: 1.5px; white-space: nowrap;
    }

    /* ── Products Section ──────────────────────────────────── */
    .products-section {
      max-width: 1280px; margin: 0 auto; padding: 2rem 1.5rem 4rem;
    }
    .products-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;
    }
    .products-title {
      font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: 2px;
      text-transform: uppercase; color: var(--text-secondary);
    }
    .view-toggle { display: flex; gap: 5px; }
    .view-btn {
      background: rgba(0,212,255,.05); border: 1px solid var(--border-dim);
      color: var(--text-dim); padding: 6px 11px; border-radius: 4px; cursor: pointer;
      font-size: 13px; transition: all .15s;
    }
    .view-btn.active {
      color: var(--accent-cyan); border-color: var(--border-bright);
      background: rgba(0,212,255,.08);
      box-shadow: var(--glow-cyan);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    /* ── Product Card — Fintech Analytics style ────────────── */
    .product-card {
      background: linear-gradient(160deg, var(--bg-panel) 0%, rgba(8,15,30,.98) 100%);
      border: 1px solid var(--border-dim); border-radius: 8px; overflow: hidden;
      display: flex; flex-direction: column; text-decoration: none; color: inherit;
      transition: transform .22s cubic-bezier(.25,.8,.25,1),
                  border-color .22s, box-shadow .22s;
      position: relative;
    }

    /* top cyan data-line accent */
    .product-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--accent-cyan) 50%, transparent 100%);
      opacity: 0; transition: opacity .22s;
    }
    .product-card:hover::before { opacity: 1; }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: rgba(0,212,255,.3);
      box-shadow:
        0 0 0 1px rgba(0,212,255,.08),
        0 8px 32px rgba(0,0,0,.55),
        0 0 24px rgba(0,212,255,.1);
    }

    .product-card-img {
      width: 100%; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }

    /* scanline overlay on card images */
    .product-card-img::after {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,.0) 0px, rgba(0,0,0,.0) 2px,
        rgba(0,0,0,.12) 2px, rgba(0,0,0,.12) 4px
      );
      pointer-events: none;
    }

    .pc-badge {
      position: absolute; top: 10px; left: 10px;
      background: linear-gradient(90deg, rgba(0,212,255,.95), rgba(0,255,204,.8));
      color: #020a16; font-family: 'Share Tech Mono', monospace;
      font-size: 8.5px; letter-spacing: 2px; font-weight: 700; text-transform: uppercase;
      padding: 3px 9px; border-radius: 2px;
      box-shadow: 0 0 12px rgba(0,212,255,.55);
    }

    .product-card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 5px; }
    .product-card-game {
      font-family: 'Share Tech Mono', monospace; font-size: 9px; letter-spacing: 2px;
      color: var(--accent-teal); text-transform: uppercase;
      opacity: .8;
    }
    .product-card-name {
      font-family: 'Exo 2', sans-serif; font-size: 12.5px; font-weight: 600;
      color: var(--text-primary); line-height: 1.45; flex: 1;
    }
    .pc-rating { font-size: 11px; color: var(--accent-cyan); }
    .pc-rev { color: var(--text-dim); font-size: 10px; }
    .product-card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: auto !important; }
    .pc-price {
      font-family: 'Share Tech Mono', monospace; font-size: 14px; font-weight: 700;
      color: var(--accent-cyan);
      text-shadow: 0 0 10px rgba(0,212,255,.4);
    }
    .pc-old { font-size: 10.5px; color: var(--text-dim); text-decoration: line-through; }
    .pc-cart-btn {
      margin-left: auto;
      background: rgba(0,212,255,.07);
      border: 1px solid rgba(0,212,255,.28);
      color: var(--accent-cyan);
      font-size: 9px; font-weight: 700; letter-spacing: 1px;
      padding: 5px 11px; border-radius: 3px; cursor: pointer; transition: all .18s;
      text-transform: uppercase; font-family: 'Share Tech Mono', monospace;
    }
    .pc-cart-btn:hover {
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-teal));
      color: #020a16; border-color: transparent;
      box-shadow: 0 0 16px rgba(0,212,255,.45);
    }

    /* ── Trust Strip ───────────────────────────────────────── */
    .trust-strip {
      background: rgba(6,13,26,.92);
      border-top: 1px solid var(--border-dim);
      border-bottom: 1px solid var(--border-dim);
      padding: .7rem 0; margin-bottom: 2rem;
      backdrop-filter: blur(10px);
    }
    .trust-strip-inner {
      max-width: 1280px; margin: 0 auto; padding: 0 1.5rem;
      display: flex; align-items: center; gap: 28px; overflow-x: auto;
    }
    .ts-item { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
    .ts-ico { font-size: 13px; }
    .ts-text {
      font-family: 'Share Tech Mono', monospace; font-size: 9.5px; letter-spacing: 1.5px;
      color: var(--text-dim); text-transform: uppercase;
    }

    /* ── Cart Toast ────────────────────────────────────────── */
    .cart-toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 999;
      background: var(--bg-panel);
      border: 1px solid rgba(0,212,255,.3);
      color: var(--text-primary); padding: 12px 20px; border-radius: 6px; font-size: 13px;
      opacity: 0; transform: translateY(10px); transition: all .3s; pointer-events: none;
      font-family: 'Exo 2', sans-serif; max-width: 300px;
      box-shadow: var(--glow-cyan), 0 8px 32px rgba(0,0,0,.6);
      backdrop-filter: blur(12px);
    }
    .cart-toast::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
    }
    .cart-toast.show { opacity: 1; transform: translateY(0); }

    /* ═══════════════════════════════════════════════════════════
       GLOBAL RESET & BASE
       ═══════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Exo 2', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; }

    /* ═══════════════════════════════════════════════════════════
       TICKER BAR
       ═══════════════════════════════════════════════════════════ */
    .ticker-bar {
      background: linear-gradient(90deg, rgba(0,212,255,.08) 0%, rgba(0,255,204,.06) 50%, rgba(0,212,255,.08) 100%);
      border-bottom: 1px solid var(--border-mid);
      overflow: hidden; white-space: nowrap; height: 32px;
      display: flex; align-items: center;
      position: relative;
    }
    .ticker-bar::before,
    .ticker-bar::after {
      content: '';
      position: absolute; top: 0; bottom: 0; width: 60px; z-index: 2; pointer-events: none;
    }
    .ticker-bar::before { left: 0; background: linear-gradient(90deg, var(--bg-base), transparent); }
    .ticker-bar::after  { right: 0; background: linear-gradient(-90deg, var(--bg-base), transparent); }
    .ticker-inner {
      display: inline-flex; gap: 48px; align-items: center;
      animation: ticker-scroll 28s linear infinite;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px; letter-spacing: 1.2px; color: var(--text-secondary);
    }
    @keyframes ticker-scroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .t-live {
      display: inline-flex; align-items: center; gap: 7px;
      color: var(--accent-cyan); font-weight: 700; letter-spacing: 2px;
    }
    .pulse {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
      animation: pulse-dot 1.4s ease-in-out infinite;
    }

    /* ═══════════════════════════════════════════════════════════
       HEADER
       ═══════════════════════════════════════════════════════════ */
    header {
      background:
        linear-gradient(180deg, rgba(6,13,26,.99) 0%, rgba(10,22,40,.98) 100%);
      border-bottom: 1px solid var(--border-dim);
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(20px) saturate(1.6);
    }

    /* HUD corner brackets */
    .hud-c { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
    .hc {
      position: absolute; width: 10px; height: 10px;
      border-color: rgba(0,212,255,.35); border-style: solid;
    }
    .hc-tl { top: 6px; left: 6px; border-width: 1px 0 0 1px; }
    .hc-tr { top: 6px; right: 6px; border-width: 1px 1px 0 0; }
    .hc-bl { bottom: 6px; left: 6px; border-width: 0 0 1px 1px; }
    .hc-br { bottom: 6px; right: 6px; border-width: 0 1px 1px 0; }

    /* Header top strip — search + actions */
    .header-top {
      border-bottom: 1px solid var(--border-dim);
      padding: .55rem 0;
    }
    .header-top-inner {
      max-width: 1280px; margin: 0 auto; padding: 0 1.5rem;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .search-wrap { flex: 1; max-width: 680px; }
    .search-bar {
      display: flex; align-items: center;
      background: rgba(10,22,40,.95);
      border: 1px solid var(--border-mid);
      border-radius: 5px; overflow: hidden;
      transition: border-color .18s, box-shadow .18s;
    }
    .search-bar:focus-within {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 2px rgba(0,212,255,.1), var(--glow-cyan);
    }
    .search-category {
      background: rgba(0,212,255,.06); border: none; border-right: 1px solid var(--border-dim);
      color: var(--text-secondary); font-family: 'Share Tech Mono', monospace;
      font-size: 10px; letter-spacing: 1px; padding: 8px 10px;
      outline: none; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .search-ico {
      color: var(--text-dim); padding: 0 8px; flex-shrink: 0; display: flex; align-items: center;
    }
    .search-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text-primary); font-family: 'Exo 2', sans-serif; font-size: 13px;
      padding: 8px 10px;
    }
    .search-input::placeholder { color: var(--text-dim); }
    .search-btn {
      display: flex; align-items: center; gap: 6px;
      background: linear-gradient(90deg, rgba(0,212,255,.15), rgba(0,255,204,.1));
      border: none; border-left: 1px solid var(--border-mid);
      color: var(--accent-cyan); font-family: 'Share Tech Mono', monospace;
      font-size: 10px; letter-spacing: 1.5px; font-weight: 700; text-transform: uppercase;
      padding: 8px 16px; transition: background .18s, color .18s;
      flex-shrink: 0;
    }
    .search-btn:hover {
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-teal));
      color: #020a16;
    }
    .top-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .btn-wish {
      background: rgba(0,212,255,.05); border: 1px solid var(--border-dim);
      color: var(--text-secondary); border-radius: 5px; padding: 7px 10px;
      display: flex; align-items: center; transition: all .18s;
    }
    .btn-wish:hover { color: #e05; border-color: rgba(220,0,80,.4); background: rgba(220,0,80,.06); }
    .btn-login {
      background: transparent; border: 1px solid var(--border-mid);
      color: var(--text-secondary); font-family: 'Share Tech Mono', monospace;
      font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
      padding: 7px 16px; border-radius: 4px; transition: all .18s;
    }
    .btn-login:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
    .btn-prime {
      background: linear-gradient(90deg, rgba(0,212,255,.9), rgba(0,255,204,.85));
      border: none; color: #020a16; font-family: 'Share Tech Mono', monospace;
      font-size: 10px; letter-spacing: 1.5px; font-weight: 700; text-transform: uppercase;
      padding: 8px 18px; border-radius: 4px;
      box-shadow: 0 0 18px rgba(0,212,255,.3);
      transition: box-shadow .18s, opacity .18s;
    }
    .btn-prime:hover { box-shadow: 0 0 28px rgba(0,212,255,.55); opacity: .92; }

    /* Main header row — logo + nav */
    .header-inner {
      max-width: 1280px; margin: 0 auto; padding: .6rem 1.5rem;
      display: flex; align-items: center; gap: 32px;
      position: relative; z-index: 1;
    }

    /* Logo */
    .logo {
      display: flex; flex-direction: column; gap: 0;
      text-decoration: none; flex-shrink: 0; position: relative;
    }
    .logo-digital {
      font-family: 'Share Tech Mono', monospace; font-size: 7px;
      letter-spacing: 4px; text-transform: uppercase; color: var(--accent-teal);
      opacity: .8;
    }
    .logo-wordmark { display: flex; align-items: baseline; gap: 0; line-height: 1; }
    .logo-play {
      font-family: 'Orbitron', sans-serif; font-size: 22px; font-weight: 900;
      color: var(--text-primary); letter-spacing: -1px;
    }
    .logo-beat {
      font-family: 'Orbitron', sans-serif; font-size: 22px; font-weight: 900;
      color: var(--accent-cyan); letter-spacing: -1px;
      text-shadow: 0 0 16px rgba(0,212,255,.5);
    }
    .logo-underline {
      height: 1px; margin-top: 3px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-teal), transparent);
    }

    /* Nav */
    nav { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
    .nav-item {
      font-family: 'Share Tech Mono', monospace; font-size: 10.5px; letter-spacing: 1px;
      text-transform: uppercase; color: var(--text-secondary);
      padding: 6px 10px; border-radius: 4px;
      border: 1px solid transparent;
      transition: color .15s, border-color .15s, background .15s;
      white-space: nowrap;
    }
    .nav-item:hover { color: var(--accent-cyan); border-color: var(--border-dim); background: rgba(0,212,255,.04); }
    .nav-item.active {
      color: var(--accent-cyan); border-color: var(--border-bright);
      background: rgba(0,212,255,.07);
      box-shadow: 0 0 10px rgba(0,212,255,.12);
    }
    .nav-sep {
      width: 1px; height: 16px; background: var(--border-dim); margin: 0 4px; flex-shrink: 0;
    }
    .nav-special {
      color: #ff6b35 !important;
      border-color: rgba(255,107,53,.2) !important;
      background: rgba(255,107,53,.05) !important;
    }
    .nav-special:hover { border-color: rgba(255,107,53,.5) !important; background: rgba(255,107,53,.1) !important; }
    .nav-outsource {
      color: var(--accent-teal) !important;
      border-color: rgba(0,255,204,.2) !important;
      background: rgba(0,255,204,.05) !important;
    }
    .nav-outsource:hover { border-color: rgba(0,255,204,.45) !important; background: rgba(0,255,204,.1) !important; }

    /* ═══════════════════════════════════════════════════════════
       FOOTER
       ═══════════════════════════════════════════════════════════ */
    .site-footer {
      background:
        radial-gradient(ellipse 70% 50% at 20% 100%, rgba(0,212,255,.04) 0%, transparent 60%),
        linear-gradient(180deg, var(--bg-surface) 0%, var(--bg-base) 100%);
      border-top: 1px solid var(--border-dim);
      position: relative; overflow: hidden;
      margin-top: 2rem;
    }

    /* Footer HUD corners */
    .f-hud { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
    .f-hc {
      position: absolute; width: 12px; height: 12px;
      border-color: rgba(0,212,255,.25); border-style: solid;
    }
    .f-hc-tl { top: 8px; left: 8px; border-width: 1px 0 0 1px; }
    .f-hc-tr { top: 8px; right: 8px; border-width: 1px 1px 0 0; }
    .f-hc-bl { bottom: 8px; left: 8px; border-width: 0 0 1px 1px; }
    .f-hc-br { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; }

    /* top glow line */
    .site-footer::before {
      content: '';
      position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-teal), transparent);
      opacity: .5;
    }

    .footer-inner {
      max-width: 1280px; margin: 0 auto; padding: 3rem 1.5rem 1.5rem;
      position: relative; z-index: 1;
    }

    /* Footer banner row — logo + support */
    .footer-banner {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 2rem; margin-bottom: 2.5rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border-dim);
    }

    /* Footer logo */
    .footer-logo { display: flex; flex-direction: column; gap: 2px; text-decoration: none; }
    .footer-logo-digital {
      font-family: 'Share Tech Mono', monospace; font-size: 7px;
      letter-spacing: 4px; text-transform: uppercase; color: var(--accent-teal); opacity: .7;
    }
    .footer-logo-wordmark { display: flex; align-items: baseline; gap: 0; }
    .footer-logo-play {
      font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900;
      color: var(--text-primary);
    }
    .footer-logo-beat {
      font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900;
      color: var(--accent-cyan); text-shadow: 0 0 16px rgba(0,212,255,.45);
    }
    .footer-logo-pvt {
      font-family: 'Share Tech Mono', monospace; font-size: 7.5px;
      letter-spacing: 3px; text-transform: uppercase; color: var(--text-dim);
      margin-top: 2px; padding-left: 2px;
    }
    .footer-logo-line {
      height: 1px; margin-top: 6px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-teal), transparent);
    }
    .footer-tagline {
      font-family: 'Exo 2', sans-serif; font-size: 12px; color: var(--text-dim);
      margin-top: 10px; letter-spacing: .3px;
    }
    .ft-play { color: var(--text-secondary); }
    .ft-beat { color: var(--accent-cyan); }

    /* Support buttons */
    .footer-support { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
    .support-label {
      font-family: 'Share Tech Mono', monospace; font-size: 9px;
      letter-spacing: 2.5px; text-transform: uppercase; color: var(--text-dim);
    }
    .btn-support {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: 'Share Tech Mono', monospace; font-size: 10px;
      letter-spacing: 1.2px; text-transform: uppercase;
      padding: 8px 18px; border-radius: 4px; border: 1px solid var(--border-mid);
      transition: all .18s; min-width: 140px;
      background: rgba(10,22,40,.9);
    }
    .btn-support.email   { color: var(--accent-cyan); }
    .btn-support.whatsapp { color: #25d366; border-color: rgba(37,211,102,.25); }
    .btn-support.telegram { color: #2aabee; border-color: rgba(42,171,238,.25); }
    .btn-support:hover {
      background: rgba(0,212,255,.08); border-color: var(--border-bright);
      box-shadow: var(--glow-cyan);
    }
    .btn-support.whatsapp:hover { background: rgba(37,211,102,.08); border-color: rgba(37,211,102,.5); box-shadow: 0 0 14px rgba(37,211,102,.2); }
    .btn-support.telegram:hover { background: rgba(42,171,238,.08); border-color: rgba(42,171,238,.5); box-shadow: 0 0 14px rgba(42,171,238,.2); }

    /* Footer grid — 4 columns */
    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1.5fr;
      gap: 2rem; margin-bottom: 2.5rem;
    }
    .footer-col-title {
      font-family: 'Share Tech Mono', monospace; font-size: 9.5px;
      letter-spacing: 2.5px; text-transform: uppercase; color: var(--accent-cyan);
      margin-bottom: 14px; opacity: .85;
    }
    .footer-nav-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px;
    }
    .footer-nav-link {
      font-family: 'Exo 2', sans-serif; font-size: 12px;
      color: var(--text-secondary); padding: 4px 0;
      transition: color .15s; white-space: nowrap;
    }
    .footer-nav-link:hover { color: var(--accent-cyan); }
    .footer-nav-link.special { color: #ff6b35 !important; }
    .footer-link-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .footer-link-list a {
      font-family: 'Exo 2', sans-serif; font-size: 12px;
      color: var(--text-secondary); transition: color .15s;
    }
    .footer-link-list a:hover { color: var(--accent-cyan); }

    /* Newsletter inline overrides */
    .footer-col p { color: var(--text-secondary) !important; }
    .footer-col [style*="border:1px solid rgba(245"] {
      border-color: var(--border-bright) !important;
    }
    .footer-col input[type="email"] {
      background: rgba(10,22,40,.9) !important; color: var(--text-primary) !important;
    }
    .footer-col button {
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-teal)) !important;
      color: #020a16 !important;
    }

    /* Footer bottom bar */
    .footer-bottom {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; padding-top: 1.5rem;
      border-top: 1px solid var(--border-dim);
      flex-wrap: wrap;
    }
    .footer-copy {
      font-family: 'Share Tech Mono', monospace; font-size: 9.5px;
      letter-spacing: 1px; color: var(--text-dim);
    }
    .footer-copy strong { color: var(--text-secondary); }
    .footer-legal-links {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Share Tech Mono', monospace; font-size: 9.5px; letter-spacing: 1px;
    }
    .footer-legal-links a { color: var(--text-dim); transition: color .15s; }
    .footer-legal-links a:hover { color: var(--accent-cyan); }
    .footer-legal-links span { color: var(--text-dim); opacity: .4; }

    /* ═══════════════════════════════════════════════════════════
       RESPONSIVE
       ═══════════════════════════════════════════════════════════ */
    @media (max-width: 960px) {
      .footer-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 640px) {
      .page-hero-right { display: none; }
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .header-top-inner { flex-wrap: wrap; gap: 8px; }
      .search-wrap { max-width: 100%; width: 100%; order: 2; }
      .top-actions { order: 1; margin-left: auto; }
      nav { gap: 1px; }
      .nav-item { font-size: 9px; padding: 5px 7px; }
      .footer-banner { flex-direction: column; }
      .footer-grid { grid-template-columns: 1fr 1fr; gap: 1.5rem; }
      .footer-bottom { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- ── Shell ──────────────────────────────────────────── -->
  <header class="shell" role="banner">
    <div class="hud-corners" aria-hidden="true">
      <div class="hc hc-tl"></div>
      <div class="hc hc-tr"></div>
      <div class="hc hc-bl"></div>
      <div class="hc hc-br"></div>
    </div>

    <!-- Brand -->
    <div class="brand" aria-label="PlayBeat Digital">
      <div class="brand-icon" aria-hidden="true">🎮</div>
      <div class="brand-text">
        <span class="brand-eyebrow">Digital Marketplace</span>
        <div class="brand-name">
          <span class="brand-play">Play</span>
          <span class="brand-beat">Beat</span>
        </div>
      </div>
    </div>

    <!-- Tab navigation -->
    <nav class="tab-bar" role="tablist" aria-label="Platform sections">
      <button class="tab-btn active" role="tab" aria-selected="true" aria-controls="pane-store" id="tab-store" data-pane="pane-store" data-label="Storefront">
        <span class="tab-icon">🛒</span>
        Storefront
      </button>
      <div class="tab-divider" aria-hidden="true"></div>
      <button class="tab-btn" role="tab" aria-selected="false" aria-controls="pane-admin" id="tab-admin" data-pane="pane-admin" data-label="Admin Backend">
        <span class="tab-icon">⚙️</span>
        Admin
      </button>
    </nav>

    <!-- Status -->
    <div class="status-bar" aria-live="polite">
      <div class="status-pill">
        <div class="dot-live" aria-hidden="true"></div>
        <span class="status-text">Live</span>
      </div>
    </div>
  </header>

  <!-- ── Breadcrumb ────────────────────────────────────── -->
  <div class="breadcrumb-strip" aria-label="Current location">
    <span>PlayBeat</span>
    <span class="bc-sep">›</span>
    <span class="bc-active" id="bc-current">Storefront</span>
    <span class="bc-mode-badge store" id="bc-badge">STORE</span>
  </div>

  <!-- ── Viewport ──────────────────────────────────────── -->
  <main class="viewport" role="main">

    <!-- Loading overlay -->
    <div class="load-overlay" id="load-overlay" aria-hidden="true">
      <div class="load-ring"></div>
      <div class="load-label">Loading platform…</div>
    </div>

    <iframe
      id="pane-store"
      class="pane active"
      src="storefront.html"
      role="tabpanel"
      aria-labelledby="tab-store"
      title="PlayBeat Storefront"
      loading="eager"
    ></iframe>

    <iframe
      id="pane-admin"
      class="pane hidden"
      src="admin.html"
      role="tabpanel"
      aria-labelledby="tab-admin"
      title="PlayBeat Admin Backend"
      loading="lazy"
    ></iframe>

  </main>

  <script>
    (() => {
      const tabs   = document.querySelectorAll('.tab-btn');
      const panes  = document.querySelectorAll('.pane');
      const bcText = document.getElementById('bc-current');
      const bcBadge= document.getElementById('bc-badge');
      const overlay= document.getElementById('load-overlay');

      // Hide loader once the first iframe loads
      document.getElementById('pane-store').addEventListener('load', () => {
        overlay.classList.add('done');
        setTimeout(() => { overlay.style.display = 'none'; }, 450);
      }, { once: true });

      function switchTo(targetId, label) {
        // Update tabs
        tabs.forEach(t => {
          const isActive = t.dataset.pane === targetId;
          t.classList.toggle('active', isActive);
          t.setAttribute('aria-selected', isActive);
        });

        // Update panes
        panes.forEach(p => {
          const isActive = p.id === targetId;
          p.classList.toggle('active', !isActive ? false : true);
          p.classList.toggle('hidden', isActive ? false : true);
          if (isActive) {
            p.classList.remove('hidden');
            p.classList.add('active');
          } else {
            p.classList.add('hidden');
            p.classList.remove('active');
          }
        });

        // Update breadcrumb
        bcText.textContent = label;
        const isAdmin = targetId === 'pane-admin';
        bcBadge.textContent = isAdmin ? 'ADMIN' : 'STORE';
        bcBadge.className = 'bc-mode-badge ' + (isAdmin ? 'admin' : 'store');
      }

      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          switchTo(tab.dataset.pane, tab.dataset.label);
        });
      });

      // Keyboard navigation
      tabs.forEach((tab, i) => {
        tab.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
            e.preventDefault();
            const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
            next.focus();
            next.click();
          }
        });
      });
    })();
  </script>
</body>
</html>
